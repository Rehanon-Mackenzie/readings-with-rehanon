{% extends "base.html" %}
{% load crispy_forms_tags %}


{% block title %}{{ page_title }} | Readings with Rehanon{% endblock title %}


{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h1>{{ page_title }}</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-brand">Save Reading</button>
                {% if reading %}
                    <a href="{{ reading.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
                {% else %}
                    <a href="{% url 'reading_list' %}" class="btn btn-outline-secondary">Cancel</a>
                {% endif %}
            </form>
        </div>
    </div>
</div>
{% endblock content %}
