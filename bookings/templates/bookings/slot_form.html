{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block content %}
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="mb-4">Add a slot</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-brand">Save slot</button>
                    <a href="{% url 'manage_slots' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
