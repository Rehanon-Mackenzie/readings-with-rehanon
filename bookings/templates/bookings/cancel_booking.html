{% extends "base.html" %}


{% block content %}
<div class="container my-5">
    <div class="row justify-content center">
        <div class="col-md-8 col-lg-6">
            <h1 class="mb-3">Cancel this reading?</h1>
            <p><strong>{{ booking.reading_type.name }}</strong><br>{{ booking.slot }}</p>
            <p>This time will be released for other clients.</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Yes, cancel it</button>
                <a href="{% url 'my_bookings' %}" class="btn btn-outline-secondary">Keep my booking</a>
            </form>
            <p>Refunds will be processed within 5 working days.</p>
        </div>
    </div>
</div>    
{% endblock content %}
