{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-g-6">
            <h1 class="mb-3">Move your reading</h1>
            <p><strong>{{ booking.reading_type.name }}</strong><br>Currently: {{ booking.slot }}</p>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn-brand" type="submit">Move my booking</button>
                <a href="{% url 'my_bookings' %}" class="btn btn-outline-secondary">Keep current time</a>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
